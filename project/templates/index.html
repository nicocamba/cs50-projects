<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
    <style>
        body {
            height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center center;
            width: 100%;
            text-align: center;
            padding: 50px 0;
        }

        main {
            background-color: #f8f9fa; /* Fondo blanco para el contenido principal */
            padding: 20px;
        }

        h1 {
            color: #007bff; /* Color azul primario de Bootstrap */
        }

        /* Estilo para la imagen de la bandera */
        .flag-img {
            max-width: 100%;
            height: auto;
            margin-top: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease-in-out;
        }

        .flag-img:hover {
            transform: scale(1.1);
        }
    </style>
    <title>Búsqueda</title>
</head>
<body>
    <!--Página principal-->
    <header>
        <h1>
            Seleccione el punto inicial y final de su ruta:
        </h1>
    </header>
    <main class="container mt-5">
        <form action="/" method="post">
            <div class="row">
                <div class="col-md-6">
                    <div class="form-group mb-3">
                        <select name="Poblacion-Inicial" class="form-control">
                            {% for Poblacion in Poblaciones %}
                                <option value="{{ Poblacion }}">{{ Poblacion }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-group mb-3">
                        <select name="Poblacion-Final" class="form-control">
                            {% for Poblacion in Poblaciones %}
                                <option value="{{ Poblacion }}">{{ Poblacion }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
            </div>
            <div class="d-grid gap-2 col-6 mx-auto mt-5">
                <button class="btn btn-primary" type="submit">Búsqueda</button>
            </div>
        </form>

        <!-- Contenedor para la imagen de la bandera debajo del botón -->
        <div class="text-center">
            <img class="flag-img" src="static/BanderaGallega.png" alt="Bandera Gallega" style="width: 20%;">
        </div>
    </main>
</body>
</html>
