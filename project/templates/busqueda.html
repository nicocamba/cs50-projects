<!-- templates/busqueda.html -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <title>Búsqueda</title>
</head>
<body>
    <div class="container">
        <h1 class="mt-5">Imágenes de poblaciones seleccionadas</h1>

        <div class="image-container">
            <div>
                <h2>Población Inicial: {{ poblacion_inicial }}</h2>
                <img src="{{ url_for('static', filename='Imagen' + Poblaciones.index(poblacion_inicial)|string + '.png') }}" alt="Imagen inicial">
            </div>
            <div>
                <h2>Población Final: {{ poblacion_final }}</h2>
                <img src="{{ url_for('static', filename='Imagen' + Poblaciones.index(poblacion_final)|string + '.png') }}" alt="Imagen final">
            </div>
        </div>

        {% if ruta_optima is defined %}
        <div class="route-container">
            <h2>Ruta óptima:</h2>
            <ul>
                {% for poblacion in ruta_optima %}
                    <li>{{ Poblaciones[poblacion] }}</li>
                {% endfor %}
            </ul>
        </div>
        {% endif %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</body>
</html>
