<!DOCTYPE html>

<html lang="en">
    <head>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500&display=swap" rel="stylesheet">
        <link href="styles.css" rel="stylesheet">
        <title>Trivia!</title>
        <script>
            document.addEventListener('DOMContentLoaded', function(){
                let correct_button = document.querySelector('#correct');
                let incorrect_button = document.querySelectorAll('.incorrect');
                let message_1 = document.querySelector('#message');

                correct_button.addEventListener('click', function(){
                    correct_button.style.backgroundColor = "green";
                    message_1.innerHTML = "Correct";
                })
                for (let i = 0; i < incorrect_button.length; i++)
                {
                    incorrect_button[i].addEventListener('click', function(){
                        incorrect_button[i].style.backgroundColor = "red";
                        message_1.innerHTML = "Incorrect";
                    })
                }
                document.querySelector('#boton_respuesta').addEventListener('click', function(){
                    let input = document.querySelector('input');
                    let message_2 = document.querySelector('#message2');
                    if (input.value == "Apia")
                    {
                        message_2.innerHTML = "Correct";
                        input.style.color = "green";
                    }
                    else
                    {
                        message_2.innerHTML = "Incorrect";
                        input.style.color = "red";
                    }
                })
            });
        </script>
    </head>
    <body>
        <div class="header">
            <h1>Trivia!</h1>
        </div>

        <div class="container">
            <div class="section">
                <h2>Part 1: Multiple Choice </h2>
                <hr>
                <!-- TODO: Add multiple choice question here -->
                <h3>¿Cuál es la ciudad más bonita de España?</h3>
                <button id="correct">Ourense</button>
                <button class="incorrect">Barcelona</button>
                <button class="incorrect">Burgos</button>
                <button class="incorrect">León</button>
                <p id="message"></p>

            </div>

            <div class="section">
                <h2>Part 2: Free Response</h2>
                <hr>
                <h3>¿Cuál es la capital de Samoa?</h3>
                <input type="text">
                <button id="boton_respuesta">Enviar Respuesta</button>
                <p id="message2"></p>
            </div>
        </div>
    </body>
</html>
