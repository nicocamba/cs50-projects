<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
    <style>
        /* Estilos para centrar el header */
        header.centered {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100px; /* Ajusta esta altura según tus necesidades */
            font-family: "Agency FB", sans-serif; /* Cambia la tipografía a "Agency FB" */
        }

        body {
            background-image: url("static/BanderaGallega.png");
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center center;
            height: 100vh;
        }

        /* Estilos para el botón */
        .btn-custom {
            width: 400px; /* Ajusta el ancho del botón según tus necesidades */
            height: 60px; /* Ajusta la altura del botón según tus necesidades */
            font-size: 20px; /* Ajusta el tamaño de la fuente del botón según tus necesidades */
            font-weight: bold;
            background-color: black;
            color: white;
            border: 3px solid black; /* Grosor del borde del botón */
            margin-top: 50px; /* Ajusta la distancia desde arriba según tus necesidades */
            transform: translateY(50%); /* Centra verticalmente el botón */
        }

        /* Estilos para centrar horizontalmente el botón */
        .center-btn {
            display: flex;
            justify-content: center;
        }
    </style>
    <title>Búsqueda</title>
</head>
<body>
    <!--Página principal-->
    <header class="centered">
        <h1>
            Seleccione el punto inicial y final de su ruta:
        </h1>
    </header>
    <main>
        <form action="/" method="post">
            <div class="container">
                <div class="row">
                    <div class="col-md-6">
                        <div class="form-group mb-3">
                            <select name="Poblacion-Inicial" class="form-control">
                                {% for Poblacion in Poblaciones %}
                                    <option value="{{ Poblacion }}">{{ Poblacion }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group mb-3">
                            <select name="Poblacion-Final" class="form-control">
                                {% for Poblacion in Poblaciones %}
                                    <option value="{{ Poblacion }}">{{ Poblacion }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                </div>
            </div>
            <div class="d-grid center-btn">
                <button class="btn btn-primary btn-custom" type="submit">Búsqueda</button>
            </div>
        </form>
    </main>
</body>
</html>
